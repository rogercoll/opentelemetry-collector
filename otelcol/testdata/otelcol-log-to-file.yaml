extensions:
  zpages:

receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: 0.0.0.0:4320
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
      output_paths:
        # The folder need to be created prior to starting the collector
        - /tmp/otelcol.log

  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp]
    metrics:
      receivers: [otlp]
      exporters: [debug, otlp]

  extensions: [zpages]
